    /* ---------- 頭：漂浮 + 輕擺 ---------- */
    .hz-head-float { left:53.119%; top:9.381%;
                      width:46.881%; aspect-ratio:1037/1291; z-index:4;
                      animation: hz-float 5.5s ease-in-out infinite alternate; }
    .hz-head-rot { inset:0; transform-origin:50% 10%;
                    animation: hz-headsway 7s ease-in-out infinite alternate; }
    .hz-head-rot > .hz { inset:0; }
    @keyframes hz-float    { from { transform: translateY(0); } to { transform: translateY(1.6%); } }
    @keyframes hz-headsway { from { transform: rotate(-.55deg); } to { transform: rotate(.55deg); } }

    /* 頭髮：下段髮絲飄動（同一張圖的裁切拷貝，接縫零位移） */
    .hz-head-base { clip-path: inset(0 0 21.2% 0); }
    .hz-hairL { clip-path: inset(78% 64% 0 0);  transform-origin:18% 78%;
                 animation: hz-hairL 4.6s ease-in-out infinite; }
    .hz-hairR { clip-path: inset(78% 0 0 50%);  transform-origin:75% 78%;
                 animation: hz-hairR 5.4s ease-in-out infinite .6s; }
    @keyframes hz-hairL {
      0%   { transform: skewX(-3.8deg); }
      45%  { transform: skewX(3.2deg); }
      70%  { transform: skewX(1.2deg); }
      100% { transform: skewX(-3.8deg); }
    }
    @keyframes hz-hairR {
      0%   { transform: skewX(3.4deg); }
      40%  { transform: skewX(-4.2deg); }
      65%  { transform: skewX(-1.6deg); }
      100% { transform: skewX(3.4deg); }
    }

    /* ---------- 眨眼 ---------- */
    .hz-lid { position:absolute; z-index:5; transform:scaleY(0); transform-origin:50% 0;
               background: radial-gradient(ellipse at 50% 25%, #ffeecb 0%, #fbe3ae 85%);
               border-bottom:.45vmin solid #2a2018;
               border-radius:50% 50% 50% 50% / 45% 45% 55% 55%;
               animation: hz-blink 5.2s linear infinite; }
    .hz-lid.left  { left:16.972%; top:39.04%; width:11.379%; height:6.197%; }
    .hz-lid.right { left:47.445%; top:37.8%; width:11.958%; height:5.732%; }
    @keyframes hz-blink {
      0%, 90.5% { transform: scaleY(0); }
      92.5%, 94.5% { transform: scaleY(1); }
      96.5%, 100% { transform: scaleY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hazel-scene .hz, .hazel-scene .hz-lid { animation:none !important; }
      .hz-lid { display:none; }
      .hz-trees-grow { transform:none; }
    }
  </style>
